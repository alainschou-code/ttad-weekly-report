<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTAD GROUP 天子創意來客週報表</title>

<!-- 外部核心 SDK -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>

<style>
:root {
  --apple-bg: #F5F5F7;
  --apple-surface: #FFFFFF;
  --apple-border: rgba(0, 0, 0, 0.08);
  --text-main: #1D1D1F;
  --text-muted: #86868B;
  --apple-blue: #0066CC;
  --apple-blue-hover: #004499;
  --green: #248A3D;
  --red: #FF3B30;
  --radius-lg: 16px;
  --radius-md: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", "Helvetica", "Arial", "Noto Sans TC", sans-serif;
  --shadow-sm: 0 2px 12px rgba(0,0,0,0.02);
  --shadow-md: 0 10px 40px rgba(0,0,0,0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--apple-bg); color: var(--text-main); -webkit-font-smoothing: antialiased; font-size: 13px; line-height: 1.5; }

/* ── 登入介面 ── */
#login-screen { position: fixed; inset: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; z-index: 9999; }
.apple-login-container { width: 100%; max-width: 360px; text-align: center; padding: 32px 24px; }
.brand-headline { font-size: 28px; font-weight: 700; letter-spacing: 0.12em; color: var(--text-main); margin-bottom: 8px; }
.brand-subline { font-size: 13px; font-weight: 400; color: var(--text-muted); margin-bottom: 40px; }
.section-micro-label { font-size: 9px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.12em; display: block; margin-bottom: 12px; text-align: left; }

.ios-segmented-control { position: relative; display: flex; background: rgba(118, 118, 128, 0.12); padding: 2px; border-radius: 9px; margin-bottom: 24px; }
.ios-segmented-control input { display: none; }
.ios-segmented-control label { flex: 1; padding: 8px 0; font-size: 13px; font-weight: 500; cursor: pointer; z-index: 2; }
.ios-segmented-control input:checked + label { font-weight: 600; }
.ios-segmented-slider { position: absolute; top: 2px; left: 2px; width: calc(33.333% - 2px); height: calc(100% - 4px); background: #FFFFFF; border-radius: 7px; box-shadow: 0px 3px 8px rgba(0,0,0,0.12); transition: transform 0.25s; z-index: 1; }
#dept-design:checked ~ .ios-segmented-slider { transform: translateX(0); }
#dept-plan:checked ~ .ios-segmented-slider { transform: translateX(100%); }
#dept-admin:checked ~ .ios-segmented-slider { transform: translateX(200%); }

.apple-input-box { background: #F5F5F7; border: 1px solid var(--apple-border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; text-align: left; transition: border-color 0.2s; }
.apple-input-box input, .apple-input-box select { width: 100%; border: none; background: transparent; padding: 12px 16px; font-size: 13px; outline: none; font-family: var(--font); color: var(--text-main); }
.apple-input-box select { -webkit-appearance: none; cursor: pointer; }

/* ── 主系統狀態列 ── */
.topbar { background: rgba(255, 255, 255, 0.85); backdrop-filter: saturate(180%) blur(20px); height: 64px; border-bottom: 1px solid var(--apple-border); position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
.brand-title { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }

.user-meta-card { display: flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(0,0,0,0.03); padding: 6px 16px; border-radius: 99px; border: 1px solid var(--apple-border); }
.badge-dept { background: var(--text-main); color: #FFFFFF; padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; }

/* ── 內容區 ── */
.app-container { max-width: 1400px; margin: 0 auto; padding: 32px 40px; }
.card { background: var(--apple-surface); border: 1px solid var(--apple-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 32px; overflow: hidden; }
.card-header { padding: 24px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--apple-border); }
.card-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }

/* 週次導覽列 */
.week-navigator { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.05); padding: 4px; border-radius: 10px; }
.week-btn { border: none; background: transparent; padding: 6px 14px; font-size: 12px; font-family: var(--font); cursor: pointer; border-radius: 8px; transition: all 0.2s; color: var(--text-main); font-weight: 500; }
.week-btn.active { background: var(--apple-surface); box-shadow: var(--shadow-sm); font-weight: 600; }

/* 人員膠囊篩選器 */
.pill-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.pill-btn { border: 1px solid var(--apple-border); background: #F5F5F7; color: var(--text-main); padding: 6px 16px; border-radius: 99px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.pill-btn:hover { background: #E8E8ED; }
.pill-btn.active { background: var(--text-main); color: #FFFFFF; border-color: var(--text-main); }

/* 個案卡片 */
.project-card { background: var(--apple-surface); border: 1px solid var(--apple-border); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 20px; display: grid; grid-template-columns: 320px 1.1fr 1.2fr; gap: 36px; box-shadow: var(--shadow-sm); transition: transform 0.2s; }
.pj-company { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
.pj-name { font-size: 20px; font-weight: 700; margin: 3px 0 8px; color: var(--text-main); }
.pj-data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; background: #F5F5F7; padding: 20px; border-radius: var(--radius-lg); align-items: center; }
.data-label { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
.data-value { font-size: 22px; font-weight: 300; }
.badge-tag { background: #E8E8ED; color: var(--text-main); font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; margin-right: 6px; }

/* 四格填報資訊展示塊 */
.reports-summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 20px; grid-column: span 3; border-top: 1px solid var(--apple-border); padding-top: 20px; }
.report-box { background: #FAF9F6; border: 1px solid var(--apple-border); padding: 14px; border-radius: var(--radius-md); }
.report-box-title { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.report-box-content { font-size: 12px; color: var(--text-main); word-break: break-all; min-height: 36px; line-height: 1.6; }

/* ── 彈窗 ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(16px); display: none; align-items: center; justify-content: center; z-index: 99999; }
.modal-container { background: var(--apple-surface); border: 1px solid var(--apple-border); border-radius: var(--radius-lg); width: 100%; max-width: 580px; box-shadow: var(--shadow-md); overflow: hidden; animation: popUp 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes popUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-header { padding: 20px 24px; border-bottom: 1px solid var(--apple-border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-body { padding: 24px; max-height: 520px; overflow-y: auto; }
.staff-form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }

.staff-list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid var(--apple-border); border-radius: var(--radius-md); margin-bottom: 8px; background: #FAF9F6; }
.staff-list-name { font-weight: 600; }
.staff-list-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
.btn-primary { background: var(--apple-blue); color: white; }
.btn-primary:hover { background: var(--apple-blue-hover); }
.btn-secondary { background: #E8E8ED; color: var(--text-main); }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: rgba(0,0,0,0.04); color: var(--text-main); }
.btn-capsule { border-radius: 99px; background: #E8E8ED; color: var(--text-main); }
.toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 12px 24px; border-radius: 20px; font-size: 12px; z-index: 99999; display: none; }
</style>
</head>
<body>

<!-- ══════════════ 1. 登入頁面 ══════════════ -->
<div id="login-screen">
  <div class="apple-login-container">
    <h1 class="brand-headline">TTAD GROUP</h1>
    <p class="brand-subline">天子創意來客週報管理系統</p>
    
    <div class="ios-segmented-control">

      <div class="apple-input-box" style="margin-bottom:0;"><select id="apple-user-tenure-month">

        <option value="9">9 月</option><option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option>

    <button class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 12px;" onclick="handlePasscodeLogin()">驗證並進入系統</button>

</div>

<!-- ══════════════ 2. 主系統 ══════════════ -->
<div id="main-app" style="display: none;">
  <header class="topbar">
    <div style="display: flex; align-items: center; gap: 24px;">
      <div class="brand-title">TTAD GROUP 天子創意來客週報表</div>

    </div>
    <div class="user-meta-card">

    <div style="display:flex; gap:10px;">
      <button class="btn btn-capsule btn-sm" id="btn-4k-screenshot">螢幕截圖</button>
      <button class="btn btn-capsule btn-sm" id="btn-staff-edit" style="display:none; color:var(--apple-blue);" onclick="app.openStaffModal()">人員編輯</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="app.logout()">登出</button>

  <div class="app-container">

    <section id="admin-panel" class="card" style="display: none;">

        <span class="card-title">🏢 管理部決策主控台</span>

        <div class="pill-label" style="font-size:11px; font-weight:700; color:var(--text-muted);">選擇企劃人員</div>
        <div id="planner-pills" class="pill-container" style="margin-bottom:20px;"></div>
        <div class="pill-label" style="font-size:11px; font-weight:700; color:var(--text-muted);">選擇設計人員</div>
        <div id="designer-pills" class="pill-container"></div>
      </div>
    </section>

    <!-- 個案列表 -->
    <main id="project-list-container"></main>
  </div>
</div>

<!-- ══════════════ 3. 人員編輯管理彈窗 ══════════════ -->
<div class="modal-overlay" id="staff-modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <span class="modal-title">👥 天子創意同仁名單管理</span>
      <button class="btn btn-ghost btn-sm" onclick="app.closeStaffModal()" style="font-size: 16px;">✕</button>

      <!-- 同仁列表 -->
      <div id="modal-staff-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>
</div>

<!-- ══════════════ 4. 數據填報彈窗 ══════════════ -->
<div class="modal-overlay" id="data-entry-modal">
  <div class="modal-container" style="max-width: 500px;">
    <div class="modal-header">
      <span class="modal-title" id="data-modal-title">填報週報數據</span>
      <button class="btn btn-ghost btn-sm" onclick="app.closeDataModal()" style="font-size: 16px;">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="entry-project-id">
      
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">

          <input type="number" id="entry-acc-sales" class="form-input" style="width:100%; border:1px solid var(--apple-border); padding:8px; border-radius:6px;" placeholder="0">

      <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label" style="font-weight:700; display:block; margin-bottom:4px;">現場反應</label>

      </div>

      <div class="form-group" style="margin-bottom:12px;">
        <label class="form-label" style="font-weight:700; display:block; margin-bottom:4px;">目前媒體</label>
        <textarea id="entry-current-media" class="form-textarea" style="width:100%; height:60px; border:1px solid var(--apple-border); padding:8px; border-radius:6px; font-family:var(--font);" placeholder="請輸入目前媒體配置..."></textarea>
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label class="form-label" style="font-weight:700; display:block; margin-bottom:4px;">後續媒體</label>
        <textarea id="entry-future-media" class="form-textarea" style="width:100%; height:60px; border:1px solid var(--apple-border); padding:8px; border-radius:6px; font-family:var(--font);" placeholder="請輸入後續媒體規劃..."></textarea>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button class="btn btn-secondary" onclick="app.closeDataModal()">取消</button>
        <button class="btn btn-primary" onclick="app.saveDataEntry()">儲存數據</button>
      </div>
    </div>
  </div>
</div>

// 去除名字中所有的空白字元，防止 full-width / half-width 造成的比對失敗
const sanitizeName = (str) => str ? String(str).replace(/\s+/g, '') : '';

function getWeekString(offset = 0) {
  const targetDate = new Date();
  targetDate.setDate(targetDate.getDate() + (offset * 7));
  const startOfYear = new Date(targetDate.getFullYear(), 0, 1);
  const weekNum = Math.ceil((((targetDate - startOfYear) / 86400000) + startOfYear.getDay() + 1) / 7);
  return `${targetDate.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
}

function getPrevWeekKey(weekKey) {
  const parts = weekKey.split('-W');
  if (parts.length !== 2) return weekKey;
  let year = parseInt(parts[0]);
  let week = parseInt(parts[1]);
  if (week > 1) {
    week -= 1;
  } else {
    year -= 1;
    week = 52;
  }
  return `${year}-W${String(week).padStart(2, '0')}`;
}

function getCalculatedTenure(year, month) {
  const now = new Date();
  let years = 2026 - year;
  let months = 6 - month;
  if (months < 0) { years -= 1; months += 12; }
  return `${years} 年 ${months} 個月`;
}

// ── 系統核心 TtadApp ──
class TtadApp {
  constructor() {
    this.projectDb = [];
    this.selectedPlannerFilter = '全部企劃';
    this.selectedDesignerFilter = '全部設計';
    this.currentWeekOffset = 0;
  }

  async init(name, dept, tenure) {
    this.currentStaffName = sanitizeName(name);
    this.currentDept = dept;
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-dept').textContent = dept;
    document.getElementById('user-tenure').textContent = `年資: ${tenure}`;
    
    this.updateWeekDisplay();
    await this.fetchData();
    
    if (dept === '管理部') {
      document.getElementById('admin-panel').style.display = 'block';
      document.getElementById('btn-staff-edit').style.display = 'inline-flex';
      this.initAdminFilters();
    } else {
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('btn-staff-edit').style.display = 'none';
    }
    this.renderProjectList();
    this.setupGlobalEvents();
  }

  updateWeekDisplay() {
    const label = getWeekString(this.currentWeekOffset);
    document.getElementById('current-week-display').textContent = `報表週別: ${label}`;
  }

  changeWeek(direction) {
    this.currentWeekOffset += direction;
    this.updateWeekDisplay();
    this.renderProjectList();
  }

  async fetchData() {
    try {
      const resp = await fetch(GOOGLE_SHEET_URL);
      const text = await resp.text();
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
      
      this.projectDb = json.table.rows.slice(1).map((r, index) => {
        const getCell = (idx) => (r.c && r.c[idx] && r.c[idx].v !== null) ? String(r.c[idx].v).trim() : '';
        const fullName = getCell(2); 
        let company = '天子創意';
        let prjName = fullName;
        if (fullName.includes('-')) {
          company = fullName.split('-')[0].trim();
          prjName = fullName.split('-')[1].trim();
        } else if (fullName.includes('．')) {
          company = fullName.split('．')[0].trim();
          prjName = fullName.split('．')[1].trim();
        }

        return {
          id: String(index + 1),
          category: getCell(0), // A欄 類別
          location: getCell(1), // B欄 區域地址
          company: company,
          name: prjName,
          stage: getCell(3), // D欄 狀態
          planner: sanitizeName(getCell(7)), // H欄 負責企劃 (去除空白)
          designer: sanitizeName(getCell(8)) // I欄 負責設計 (去除空白)
        };
      });

      // 自動同步雲端試算表中新增的新同仁
      this.syncNewColleaguesFromSheet();

    } catch(e) { console.error('資料載入失敗', e); }
  }

  syncNewColleaguesFromSheet() {
    let hasChanges = false;
    const currentStaffNames = Object.values(STAFF_DATABASE).map(u => sanitizeName(u.name));

    this.projectDb.forEach(pj => {
      const excludeNames = ['周于堯', '古欣代', '外發', '外發人員', '無', ''];
      if (pj.planner && !excludeNames.includes(pj.planner) && !currentStaffNames.includes(pj.planner)) {
        const virtualEmail = `${pj.planner.toLowerCase()}@ttad.com.tw`;
        STAFF_DATABASE[virtualEmail] = {
          name: pj.planner,
          joinYear: 2026,
          joinMonth: 1,
          dept: '企劃部'
        };
        currentStaffNames.push(pj.planner);
        hasChanges = true;
      }
      if (pj.designer && !excludeNames.includes(pj.designer) && !currentStaffNames.includes(pj.designer)) {
        const virtualEmail = `${pj.designer.toLowerCase()}@ttad.com.tw`;
        STAFF_DATABASE[virtualEmail] = {
          name: pj.designer,
          joinYear: 2026,
          joinMonth: 1,
          dept: '設計部'
        };
        currentStaffNames.push(pj.designer);
        hasChanges = true;
      }
    });

    if (hasChanges) {
      saveStaffDatabase();
    }
  }

  initAdminFilters() {
    const planners = ['全部企劃', ...new Set(Object.values(STAFF_DATABASE).filter(u=>u.dept==='企劃部').map(u=>sanitizeName(u.name)))];

  // 智慧週次跨週繼承核心 (自動追溯過去填寫過的最深 12 週記錄)
  getProjectInheritedData(projectId) {
    const currentWeek = getWeekString(this.currentWeekOffset);
    const currentRecord = (WEEKLY_RECORDS_DB[currentWeek] && WEEKLY_RECORDS_DB[currentWeek][projectId]) || {};

    // 往前找尋上週或歷史最近一次的填寫紀錄
    let feedback = currentRecord.feedback || '';
    let currentMedia = currentRecord.currentMedia || '';
    let futureMedia = currentRecord.futureMedia || '';
    let totalUnits = currentRecord.totalUnits !== undefined && currentRecord.totalUnits !== 0 ? currentRecord.totalUnits : 0;
    let accSales = currentRecord.accSales !== undefined && currentRecord.accSales !== 0 ? currentRecord.accSales : 0;

    // 重新校正追溯邏輯 (不破壞構造，乾淨迭代)
    let checkWeek = getPrevWeekKey(currentWeek);
    for (let i = 0; i < 12; i++) {
      const historicalRec = WEEKLY_RECORDS_DB[checkWeek] ? WEEKLY_RECORDS_DB[checkWeek][projectId] : null;
      if (historicalRec) {
        if (!feedback && historicalRec.feedback) feedback = historicalRec.feedback;
        if (!currentMedia && historicalRec.currentMedia) currentMedia = historicalRec.currentMedia;
        if (!futureMedia && historicalRec.futureMedia) futureMedia = historicalRec.futureMedia;
        if (totalUnits === 0 && historicalRec.totalUnits) totalUnits = historicalRec.totalUnits;
        if (accSales === 0 && historicalRec.accSales) {
          // 累積銷售繼承上週累售 + 本週成交
          const currentDeals = currentRecord.deals !== undefined ? currentRecord.deals : 0;
          accSales = historicalRec.accSales + currentDeals;
        }
      }
      checkWeek = getPrevWeekKey(checkWeek);
    }

    // fallback
    if (!feedback) feedback = '暫無反應。';
    if (!currentMedia) currentMedia = '暫無媒體。';
    if (!futureMedia) futureMedia = '暫無規劃。';
    
    const visits = currentRecord.visits !== undefined ? currentRecord.visits : 0;
    const deals = currentRecord.deals !== undefined ? currentRecord.deals : 0;
    if (accSales === 0) accSales = deals; // 預設

    const progress = totalUnits > 0 ? ((accSales / totalUnits) * 100).toFixed(1) : '0.0';

    return {
      visits,
      deals,
      accSales,
      totalUnits,
      feedback,
      currentMedia,
      futureMedia,
      progress
    };
  }

  renderProjectList() {
    const container = document.getElementById('project-list-container');
    
    const filtered = this.projectDb.filter(p => {
      // 智慧過濾：凡狀態含「結案」或「8.」開頭直接隱藏
      const isClosed = p.stage.includes('結案') || p.stage.startsWith('8');
      if (isClosed) return false;

      if (this.currentDept === '管理部') {
        let matchPlanner = true;
        let matchDesigner = true;

        if (this.selectedPlannerFilter !== '全部企劃') {
          matchPlanner = (p.planner === this.selectedPlannerFilter);
        }
        if (this.selectedDesignerFilter !== '全部設計') {
          matchDesigner = (p.designer === this.selectedDesignerFilter);
        }

        if (this.selectedPlannerFilter !== '全部企劃' && this.selectedDesignerFilter !== '全部設計') {
          return matchPlanner && matchDesigner;
        } else if (this.selectedPlannerFilter !== '全部企劃') {
          return matchPlanner;
        } else if (this.selectedDesignerFilter !== '全部設計') {
          return matchDesigner;
        }
        return true; 
      }
      return p.planner === this.currentStaffName || p.designer === this.currentStaffName;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:100px; color:#86868B;">目前尚無您負責或符合篩選條件的個案項目</div>';

    container.innerHTML = filtered.map(p => {

      return `
        <div class="project-card">
          <!-- 左側建案元資訊 -->

            <div class="pj-company">${p.company}</div>
            <div class="pj-name">${p.name}</div>
            <div style="margin-bottom: 12px;">
              <span class="badge-tag" style="background:${categoryColor}; color:white;">${p.category}</span>
              <span style="font-size:11px; color:var(--text-muted)">📍 ${p.location}</span>
            </div>
            <div style="font-size:11px; color:var(--text-muted)">👤 企劃: ${p.planner} ｜ 🎨 設計: ${p.designer} ｜ 狀態: ${p.stage}</div>
          </div>

          <!-- 右側核心數據展示 -->
          <div class="pj-data-grid">
            <div><div class="data-label">週間來客</div><div class="data-value">${metrics.visits}<small style="font-size:11px; color:var(--text-muted); margin-left:2px;">組</small></div></div>
            <div><div class="data-label" style="color:var(--green);">當週成交</div><div class="data-value" style="color:var(--green);"><b>${metrics.deals}</b><small style="font-size:11px; margin-left:2px;">組</small></div></div>
            <div><div class="data-label">累售 / 總戶</div><div class="data-value" style="font-size: 16px; font-weight:700;">${metrics.accSales} <span style="font-size:12px; font-weight:400; color:var(--text-muted);">/ ${metrics.totalUnits}戶</span></div></div>
          </div>

          <!-- 填報按鈕 -->
          <div style="display:flex; align-items:center; justify-content:flex-end;">
            <button class="btn btn-primary" onclick="app.openDataModal('${p.id}', '${p.company}-${p.name}')">填報數據</button>
          </div>

          <!-- 下方四格填報資訊（含上週自動繼承顯示） -->
          <div class="reports-summary-grid">
            <div class="report-box">
              <div class="report-box-title">📈 去化進度</div>
              <div class="report-box-content" style="font-size:15px; font-weight:700; color:var(--apple-blue);">
                ${metrics.progress}% <span style="font-size:10px; font-weight:400; color:var(--text-muted); display:block;">(累售 ${metrics.accSales} 戶 / 總戶 ${metrics.totalUnits} 戶)</span>
              </div>
            </div>
            <div class="report-box">
              <div class="report-box-title">🗣 現場反應</div>
              <div class="report-box-content">${metrics.feedback}</div>
            </div>
            <div class="report-box">
              <div class="report-box-title">📺 目前媒體</div>
              <div class="report-box-content">${metrics.currentMedia}</div>
            </div>
            <div class="report-box">
              <div class="report-box-title">🔮 後續媒體</div>
              <div class="report-box-content">${metrics.futureMedia}</div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // ── 數據填報彈窗控制器 ──

    const month = parseInt(document.getElementById('m-staff-join-month').value);

    if (!name || !email || !year || !month) { alert('請填寫完整的新同仁基本資料'); return; }
    if (STAFF_DATABASE[email]) { alert('此同仁帳號已存在名單中。'); return; }

    STAFF_DATABASE[email] = { name, joinYear: year, joinMonth: month, dept };
    saveStaffDatabase();
    
    document.getElementById('m-staff-name').value = '';
    document.getElementById('m-staff-email').value = '';
    
    this.renderStaffList();
    this.initAdminFilters();
    this.renderProjectList();
    this.showToast(`✅ 新同仁 ${name} 已成功註冊入名單！`);
  }

  deletePersonnel(email) {
    if (ADMIN_WHITELIST.includes(email)) return;
    const name = STAFF_DATABASE[email]?.name || '同仁';
    if (!confirm(`確定要將「${name}」從系統同仁名單中刪除並標記為離職嗎？`)) return;

    delete STAFF_DATABASE[email];
    saveStaffDatabase();
    
    this.renderStaffList();
    this.initAdminFilters();
    this.renderProjectList();
    this.showToast(`❌ 已成功移除同仁資料`);
  }

  logout() {
    localStorage.clear();
    location.reload();
  }

  showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
  }

  setupGlobalEvents() {
    document.getElementById('btn-4k-screenshot').onclick = () => {
      this.showToast('📸 正在啟用高解析度畫布渲染，請稍候...');

      html2canvas(element, {

        link.click();
        this.showToast('✅ 螢幕截圖已儲存並下載！');
      });
    };
  }

  localStorage.setItem('ttad_name', name);
  localStorage.setItem('ttad_dept', dept);
  localStorage.setItem('ttad_year', year);
  localStorage.setItem('ttad_month', month);

  // 自動同步新填寫人
  if (!STAFF_DATABASE[mail]) {
    STAFF_DATABASE[mail] = { name, joinYear: parseInt(year), joinMonth: parseInt(month), dept };
    saveStaffDatabase();
  }

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  app.init(name, dept, getCalculatedTenure(year, month));
}
</script>
</body>
</html>
